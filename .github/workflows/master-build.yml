name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  compile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-22.04, windows-latest, macos-latest ]
        java: [ '21' ]
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ matrix.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ matrix.os }}-maven-

      - name: Build with maven
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --no-transfer-progress verify -Dtest="${{ inputs.test-filter }}" -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn --no-transfer-progress verify
          fi

      - name: List skipped tests with reasons
        shell: bash
        run: |
          if grep -q '<skipped' */target/surefire-reports/TEST-*.xml; then
            grep -h -B1 -A2 '<skipped' */target/surefire-reports/TEST-*.xml | grep -o 'testcase name="[^"]*" classname="[^"]*"\|<skipped[^>]*>\|TestAbortedException: .*'
          else
            echo "No skipped tests"
          fi

      - name: Upload jline-reader jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jline-reader
          path: reader/target/jline-reader-3.25.1.jar
          if-no-files-found: error
